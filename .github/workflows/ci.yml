name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-and-quality:
    name: Android and quality checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      - name: Set up Android SDK and native tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;30.0.15729638 cmake;4.1.2'

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Run tests, static analysis, and lint
        shell: bash
        run: ./gradlew test detekt lint --stacktrace

  windows-tests-and-lint:
    name: Windows tests and lint
    runs-on: windows-2025
    steps:
      - name: Check out sources
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      - name: Run Windows tests and lint
        shell: pwsh
        run: ./gradlew.bat :phone-desktop:test :transfer-windows:test :phone-desktop:detekt :transfer-windows:detekt :phone-desktop:lint :transfer-windows:lint --stacktrace

  proto-schema:
    name: Proto schema
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out sources
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.75.0'

      - name: Lint the v4 schema
        run: buf lint

      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ github.base_ref }}"
          git fetch --no-tags origin "$base"
          if git cat-file -e "origin/${base}:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#branch=origin/${base}"
          else
            echo "Base branch has no buf.yaml yet; skipping the breaking check"
          fi
