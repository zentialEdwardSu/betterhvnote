name: Pre-release

on:
  push:
    tags:
      - 'note-v*'
      - 'notelink-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (note-vX.Y.Z or notelink-vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      product: ${{ steps.release.outputs.product }}
      version: ${{ steps.release.outputs.version }}
      version_code: ${{ steps.release.outputs.version_code }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out workflow helpers
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Validate tag and resolve commit
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_json=$(python3 -B .github/scripts/resolve_release_tag.py --tag "$RELEASE_TAG")
          tag=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1])["tag"])' "$release_json")
          product=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1])["product"])' "$release_json")
          version=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1])["version"])' "$release_json")
          version_code=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1])["versionCode"])' "$release_json")
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          commit=$(git rev-list -n 1 "$tag")
          test -n "$commit"
          {
            echo "tag=$tag"
            echo "product=$product"
            echo "version=$version"
            echo "version_code=$version_code"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Release quality gate
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      - name: Set up Android SDK and native tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;30.0.15729638 cmake;4.1.2'

      - name: Run release quality checks
        shell: bash
        run: chmod +x ./gradlew && ./gradlew test detekt lint --stacktrace

  android:
    name: Signed Android package
    needs: [prepare, quality]
    runs-on: ubuntu-24.04
    env:
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      - name: Set up Android SDK and native tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;30.0.15729638 cmake;4.1.2'

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_STORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$EXPECTED_CERT_SHA256"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.p12"
          echo "ANDROID_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/android-release.p12" >> "$GITHUB_ENV"

      - name: Build signed APK
        shell: bash
        env:
          PRODUCT: ${{ needs.prepare.outputs.product }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [[ "$PRODUCT" == 'note' ]]; then
            ./gradlew :app:assembleRelease -PnoteVersion="$VERSION" -PnoteVersionCode="$VERSION_CODE" --stacktrace
          else
            ./gradlew :phone-app:assembleRelease -PnoteLinkVersion="$VERSION" -PnoteLinkVersionCode="$VERSION_CODE" --stacktrace
          fi

      - name: Verify and stage APK
        shell: bash
        env:
          PRODUCT: ${{ needs.prepare.outputs.product }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [[ "$PRODUCT" == 'note' ]]; then
            source_apk='build/app/outputs/apk/release/app-release.apk'
            target_apk="release-assets/BetterHvNote-$VERSION-android-arm64.apk"
          else
            source_apk='build/phone-app/outputs/apk/release/phone-app-release.apk'
            target_apk="release-assets/NoteLink-$VERSION-android.apk"
          fi
          test -f "$source_apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$apksigner" verify --verbose "$source_apk"
          actual_cert=$("$apksigner" verify --print-certs "$source_apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          expected_cert=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$actual_cert" = "$expected_cert"
          badging=$("$aapt" dump badging "$source_apk" | head -n 1)
          grep -F "versionCode='$VERSION_CODE'" <<< "$badging"
          grep -F "versionName='$VERSION'" <<< "$badging"
          cp "$source_apk" "$target_apk"

      - name: Upload Android release asset
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-android-${{ needs.prepare.outputs.tag }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing key
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP/android-release.p12" -Force -ErrorAction SilentlyContinue

  windows:
    name: Windows portable package
    if: needs.prepare.outputs.product == 'notelink'
    needs: [prepare, quality]
    runs-on: windows-2025
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      - name: Test and build portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./gradlew.bat :phone-desktop:test :transfer-windows:test :phone-desktop:packagePortableZip "-PnoteLinkVersion=$env:VERSION" --stacktrace

      - name: Verify portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-Item "build/phone-desktop/distributions/NoteLink-$env:VERSION-windows-x64.zip"
          $target = Join-Path $env:RUNNER_TEMP ("notelink-release-check-{0}" -f [guid]::NewGuid())
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $target
          $root = Join-Path $target "NoteLink-$env:VERSION"
          @('NoteLink.exe', 'README.txt', 'Allow-NoteLink-Firewall.ps1', 'Remove-NoteLink-Firewall.ps1') | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $root $_) -PathType Leaf)) { throw "Missing $_" }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'runtime') -PathType Container)) { throw 'Missing runtime directory' }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'notelink_windows.dll') -PathType Leaf)) {
            throw 'Missing notelink_windows.dll'
          }
          @('Allow-NoteLink-Firewall.ps1', 'Remove-NoteLink-Firewall.ps1') | ForEach-Object {
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $root $_), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -ne 0) { throw "PowerShell syntax error in $_`: $errors" }
            if (-not ($ast.ParamBlock.Parameters.Name.VariablePath.UserPath -contains 'Elevated')) {
              throw "Missing -Elevated parameter in $_"
            }
          }

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-windows-${{ needs.prepare.outputs.tag }}
          path: build/phone-desktop/distributions/NoteLink-${{ needs.prepare.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub pre-release
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.android.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    needs: [prepare, quality, android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out latest main with complete history
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch all release tags
        shell: bash
        run: git fetch --force --tags origin

      - name: Download release assets
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*-${{ needs.prepare.outputs.tag }}
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          assets_dir = Path("release-assets")
          files = sorted((p for p in assets_dir.iterdir() if p.is_file() and p.name != "SHA256SUMS.txt"), key=lambda p: p.name)
          lines = []
          for file_path in files:
              digest = hashlib.sha256()
              with file_path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(65536), b""):
                      digest.update(chunk)
              lines.append(f"{digest.hexdigest()}  {file_path.name}")
          (assets_dir / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY

      - name: Generate release notes
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          notes_path="$RUNNER_TEMP/release-notes.md"
          python3 -B .github/scripts/generate_release_notes.py \
            --tag "$RELEASE_TAG" \
            --repo-path "$PWD" \
            --repo-slug "$GH_REPO" \
            --assets-dir release-assets \
            --output "$notes_path" >/dev/null
          cat "$notes_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or refresh pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRODUCT: ${{ needs.prepare.outputs.product }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | LC_ALL=C sort)
          notes_path="$RUNNER_TEMP/release-notes.md"
          if [[ "$PRODUCT" == 'note' ]]; then
            title="BetterHvNote $VERSION"
          else
            title="NoteLink $VERSION"
          fi

          if existing_json=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" 2>/dev/null); then
            python3 - "$existing_json" "$RELEASE_TAG" <<'PY'
          import json
          import sys

          existing = json.loads(sys.argv[1])
          tag = sys.argv[2]
          if existing.get("draft") or not existing.get("prerelease"):
              raise SystemExit(f"Release {tag} is draft or already stable; refusing to replace its assets.")
          PY
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GH_REPO"
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "$title" \
              --notes-file "$notes_path"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GH_REPO" \
              --verify-tag \
              --prerelease \
              --latest=false \
              --title "$title" \
              --notes-file "$notes_path"
          fi

  update-changelog:
    name: Update full changelog
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: full-changelog
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out latest main with complete history
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch all release tags
        shell: bash
        run: git fetch --force --tags origin

      - name: Generate full changelog from release tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          raw_release_tags=$(
            gh api \
              --paginate \
              "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name'
          )
          mapfile -t published_tags < <(
            printf '%s\n' "$raw_release_tags" \
              | grep -E '^(note|notelink)-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true
          )

          found=0
          for tag in "${published_tags[@]}"; do
            if [[ "$tag" == "$RELEASE_TAG" ]]; then
              found=1
              break
            fi
          done
          if [[ "$found" -ne 1 ]]; then
            echo "Published release '$RELEASE_TAG' was not returned by the GitHub Releases API." >&2
            exit 1
          fi

          raw_git_tags=$(git tag -l 'note-v*' 'notelink-v*')
          mapfile -t all_tags < <(
            printf '%s\n' "$raw_git_tags" "${published_tags[@]}" \
              | grep -E '^(note|notelink)-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              | LC_ALL=C sort -u
          )

          python3 -B .github/scripts/generate_full_changelog.py \
            --repo-path "$PWD" \
            --repo-slug "$GH_REPO" \
            --output FULL_CHANGELOG.md \
            --tags "${all_tags[@]}"

      - name: Commit and push changelog when changed
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2; do
            git add -- FULL_CHANGELOG.md
            if git diff --cached --quiet; then
              echo 'FULL_CHANGELOG.md is already up to date.'
              exit 0
            fi

            git commit \
              -m "chore(changelog): update for $RELEASE_TAG" \
              -m 'Changelog-Generated: true'

            if git push origin HEAD:main; then
              exit 0
            fi

            if [[ "$attempt" -eq 2 ]]; then
              echo 'Could not push FULL_CHANGELOG.md to main after retrying on latest origin/main.' >&2
              exit 1
            fi

            echo 'Push rejected due to concurrent update on main; refreshing from origin/main and regenerating.' >&2
            git fetch --force origin main --tags
            git reset --hard origin/main

            python3 -B .github/scripts/generate_full_changelog.py \
              --repo-path "$PWD" \
              --repo-slug "$GH_REPO" \
              --output FULL_CHANGELOG.md >/dev/null
          done
