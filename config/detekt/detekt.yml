config:
  validation: true
  warningsAsErrors: true

ktlint:
  active: true
  code_style: intellij_idea
  Indentation:
    active: true
    indentSize: 2
  MaximumLineLength:
    active: true
    maxLineLength: 120

naming:
  active: true
  PackageNaming:
    active: true
    packagePattern: '^[a-z]+(\.[a-z][a-z0-9]*)*$'
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '^[a-z][a-zA-Z0-9]*$'
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**', '**/androidTest/**', '**/JnaWindowsNativeApi.kt']
  VariableNaming:
    active: true
    variablePattern: '^[a-z][a-zA-Z0-9]*$'

style:
  active: true
  UnusedImport:
    active: true
  WildcardImport:
    active: true
  VarCouldBeVal:
    active: true
  AbstractClassCanBeConcreteClass:
    active: true
  AbstractClassCanBeInterface:
    active: true

complexity:
  active: true
  TooManyFunctions:
    active: false

comments:
  active: false

exceptions:
  active: false

empty-blocks:
  active: false
